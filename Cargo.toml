[package]
name = "neural-thinker"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark"] }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
